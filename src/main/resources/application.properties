spring.application.name=gestao-encomendas

# Banco em memória para desenvolvimento (as tabelas são geradas a partir das entidades JPA)
spring.datasource.url=jdbc:h2:mem:encomendas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Console web do H2 para inspecionar as tabelas: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
